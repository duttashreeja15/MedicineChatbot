
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medicine-backend

    command:
      - uvicorn
      - api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      CHROMA_PATH: /app/data/chroma_db
      HF_HOME: /root/.cache/huggingface

    volumes:
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medicine-frontend

    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      API_URL: http://backend:8000/chat

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  huggingface_cache:
